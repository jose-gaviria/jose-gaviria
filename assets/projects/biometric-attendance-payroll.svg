<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Biometric Attendance and Payroll — camera, face pipeline, attendance, payroll, all offline in one container">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A16"/><stop offset="1" stop-color="#08182C"/>
    </linearGradient>
    <linearGradient id="bline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.28"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="400" rx="18" fill="url(#bbg)"/>
  <circle cx="300" cy="230" r="240" fill="url(#bglow)"/>
  <rect x="0.5" y="0.5" width="879" height="399" rx="18" fill="none" stroke="#1E40AF" stroke-opacity="0.45"/>

  <text x="44" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3.4" fill="#67E8F9">OFFLINE · SINGLE CONTAINER</text>
  <text x="44" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">BIOMETRIC ATTENDANCE &amp; PAYROLL</text>
  <rect x="44" y="116" width="54" height="3.5" rx="2" fill="url(#bline)"/>

  <path d="M170 228 H700" stroke="url(#bline)" stroke-width="2" stroke-opacity="0.55" fill="none"/>

  <!-- camera -->
  <g transform="translate(52,190)">
    <rect width="104" height="76" rx="10" fill="#0B1F3D" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="52" cy="38" r="22" fill="none" stroke="#22D3EE" stroke-width="2.4"/>
    <circle cx="52" cy="38" r="9" fill="#22D3EE" opacity="0.9"/>
    <rect x="72" y="12" width="18" height="7" rx="3.5" fill="#1D4ED8"/>
  </g>
  <text x="104" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">camera</text>

  <!-- face mesh -->
  <g transform="translate(232,168)">
    <path d="M60 0 C96 0 118 28 118 66 C118 110 92 132 60 132 C28 132 2 110 2 66 C2 28 24 0 60 0 Z"
          fill="#0B1F3D" stroke="#3B82F6" stroke-width="1.6"/>
    <g stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.55">
      <path d="M60 6 V126 M8 50 H112 M8 84 H112 M22 18 L98 112 M98 18 L22 112"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="38" cy="52" r="4"/><circle cx="82" cy="52" r="4"/><circle cx="60" cy="78" r="4"/>
      <circle cx="42" cy="100" r="3.5"/><circle cx="78" cy="100" r="3.5"/>
      <circle cx="60" cy="20" r="3.5"/><circle cx="14" cy="70" r="3.5"/><circle cx="106" cy="70" r="3.5"/>
    </g>
  </g>
  <text x="292" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">face pipeline</text>

  <!-- attendance clock -->
  <g transform="translate(432,182)">
    <circle cx="46" cy="46" r="44" fill="#0B1F3D" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="46" cy="46" r="33" fill="none" stroke="#1E40AF" stroke-width="1"/>
    <path d="M46 24 V48 L64 60" fill="none" stroke="#22D3EE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#38BDF8" opacity="0.8">
      <circle cx="46" cy="10" r="2.4"/><circle cx="82" cy="46" r="2.4"/><circle cx="46" cy="82" r="2.4"/><circle cx="10" cy="46" r="2.4"/>
    </g>
  </g>
  <text x="478" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">attendance</text>

  <!-- payroll document -->
  <g transform="translate(628,174)">
    <rect width="96" height="112" rx="9" fill="#0B1F3D" stroke="#3B82F6" stroke-width="1.5"/>
    <g stroke="#38BDF8" stroke-width="2" opacity="0.85">
      <path d="M18 26 H62 M18 44 H78 M18 62 H54 M18 80 H70"/>
    </g>
    <rect x="18" y="92" width="44" height="6" rx="3" fill="#22D3EE" opacity="0.9"/>
  </g>
  <text x="676" y="316" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">payroll</text>

  <!-- container outline -->
  <rect x="32" y="152" width="716" height="196" rx="14" fill="none" stroke="#1E40AF" stroke-opacity="0.55" stroke-dasharray="7 7"/>
  <text x="762" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#60A5FA">DOCKER</text>

  <text x="44" y="378" font-family="Consolas, Menlo, monospace" font-size="14" fill="#67E8F9">TypeScript · React · Node.js · Python · OpenCV · Docker</text>
</svg>
